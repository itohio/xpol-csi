; xpol-csi — cross-polarized bistatic Wi-Fi CSI occupancy/respiration sensor
; One firmware for every board; role (leader/follower/standalone) is elected at
; runtime (first board up wins leadership).
;
; Flash (one target per invocation: `-t upload -t uploadfs` together only
; writes the filesystem on this platform):
;   pio run -e debug_leader -t upload        firmware
;   pio run -e debug_leader -t uploadfs      web UI (SPIFFS from web/dist, rebuilt by scripts/build_web.py)
;   pio run -e debug_follower -t upload
; Monitor: pio device monitor -e debug_leader   (or: uv run host/monitor.py <port>)

[platformio]
default_envs = node
data_dir = web/dist

; physical boards (USB ports on this bench). The ports are assigned by macOS at
; enumeration and have swapped before: check with `s` on the console (ROLE line)
; before flashing; the leader is the board with STA MAC 10bda3cef81c.
[board_leader]
upload_port = /dev/cu.usbmodem101
monitor_port = /dev/cu.usbmodem101

[board_follower]
upload_port = /dev/cu.usbmodem1101
monitor_port = /dev/cu.usbmodem1101

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = seeed_xiao_esp32c5
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.filesystem = spiffs
board_upload.flash_size = 8MB
monitor_dtr = 1
monitor_rts = 0
extra_scripts = pre:scripts/build_web.py
; Sensing budget (overrides the config.h defaults). RAM per link is
; BREATH_WIN_SEC x DSP_DECIM_HZ x 16 subcarriers x 2 B: 3 links at 20 Hz and
; 6 links at 10 Hz cost the same ~46 KB. 20 Hz gives the heart band (<= 2.5 Hz)
; a 10 Hz Nyquist and finer waveforms; more links means more illuminators.
sensing_flags =
    -DMAX_LINKS=3
    -DDSP_DECIM_HZ=20
build_flags =
    -std=gnu++17
    -Wall
    ${env.sensing_flags}
build_unflags =
    -std=gnu++11

[env:node]
; standard build: lightweight telemetry (EVT/ROLE/CH/SCENE), CSI stream off by
; default (toggle with 'v' from the host tool)

[env:step1]
; minimal bring-up: LED blink + UART link + USB telemetry only (no wifi/csi/web)
build_flags =
    ${env.build_flags}
    -DSTEP1=1

[env:step2]
; LED + leader election + telemetry (no csi, no web)
build_flags =
    ${env.build_flags}
    -DSTEP2=1

[env:step3]
; + Wi-Fi SoftAP + web dashboard on the leader (no csi)
build_flags =
    ${env.build_flags}
    -DSTEP3=1

[env:step4]
; full pipeline: election + survey + CSI + DSP. Leader network: SoftAP
; "xpol-csi", dashboard at http://10.0.0.1 (AP build; never joins a router).
; Quiet by default: only light EVT/ROLE/CH/FEAT/SCENE stream. The heavy per-packet
; CSI flood is OFF until a host asks for it ('v' on, 'q' off) -> esptool always connects.
build_flags =
    ${env.build_flags}
    -DSTEP4=1

[env:verbose]
; bench build: identical pipeline but CSI flood ON from boot (no host needed).
build_flags =
    ${env.build_flags}
    -DSTEP4=1
    -DVERBOSE_USB=1

[env:debug]
; Like step4, but the LEADER joins an external Wi-Fi (STA build) and serves the
; dashboard on its LAN address; no SoftAP (router + SoftAP together froze the
; leader's CSI, README "Frozen CSI"). Export the creds first:
;   export XPOL_WIFI_SSID="YourSSID"  XPOL_WIFI_PASS="YourPass"
; Single radio: sensing is pinned to the router's channel.
build_flags =
    ${env.build_flags}
    -DSTEP4=1
    -DDEBUG_STA_SSID=\"${sysenv.XPOL_WIFI_SSID}\"
    -DDEBUG_STA_PASS=\"${sysenv.XPOL_WIFI_PASS}\"

[env:debug_leader]
extends = env:debug, board_leader

[env:debug_follower]
extends = env:debug, board_follower

[env:step4_leader]
extends = env:step4, board_leader

[env:step4_follower]
extends = env:step4, board_follower
